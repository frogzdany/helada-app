[project]
name = "helada-model"
version = "0.1.0"
description = "Helada: parcel-level frost (Tmin) model for the Toluca valley (station-anchored + terrain-transfer)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
fetch = ["requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8", "requests>=2.31", "rasterio>=1.3", "scipy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helada_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
